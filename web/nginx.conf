worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    server_tokens off;
    # Log không ghi query string, header hay body (không lộ token, chữ ký)
    log_format safe '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log safe;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;

    # SNI không phải www.gshop.test thì từ chối bắt tay TLS
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.gshop.test gshop.test;

        # Chuỗi gồm chứng thư website + Issuing CA (không gửi Root CA)
        ssl_certificate     /pki/web/fullchain.pem;
        ssl_certificate_key /pki/web/www.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 64k;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://10.66.30.10:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = / {
            default_type text/plain;
            return 200 "G-Shop lab - API tai /api/\n";
        }

        location / {
            return 404;
        }
    }
}
